<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Arial, 'Segoe UI', sans-serif" role="img"
     aria-label="Lead gelir, AI karşılama, ihtiyaç analizi, portföy eşleştirme, canlı sunum, follow-up, nitelikli lead, onay (gerekirse), satış">
  <!-- Editable sales-process workflow diagram. Node labels are the exact
       existing #flow copy from index.html (flow.step1..step9) — no new
       claims or numbers introduced. Edit text/positions directly; every
       shape is a plain rect/path/text, no embedded raster or script. -->
  <rect width="760" height="330" fill="#f6f6f2"/>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#536168"/>
    </marker>
  </defs>

  <!-- row 1 -->
  <g font-size="13.5" fill="#202c32">
    <rect x="20" y="30" width="200" height="50" rx="4" fill="#fff" stroke="#ced5d4"/>
    <text x="120" y="59" text-anchor="middle">LEAD GELİR</text>
    <rect x="280" y="30" width="200" height="50" rx="4" fill="#fff" stroke="#ced5d4"/>
    <text x="380" y="59" text-anchor="middle">AI KARŞILAMA</text>
    <rect x="540" y="30" width="200" height="50" rx="4" fill="#e5edf1" stroke="#7e9ca9"/>
    <text x="640" y="59" text-anchor="middle">İHTİYAÇ ANALİZİ</text>
  </g>
  <line x1="220" y1="55" x2="276" y2="55" stroke="#536168" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="480" y1="55" x2="536" y2="55" stroke="#536168" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- row 2 -->
  <g font-size="13.5" fill="#202c32">
    <rect x="20" y="145" width="200" height="50" rx="4" fill="#fff" stroke="#ced5d4"/>
    <text x="120" y="174" text-anchor="middle">PORTFÖY EŞLEŞTİRME</text>
    <rect x="280" y="145" width="200" height="50" rx="4" fill="#e5edf1" stroke="#7e9ca9"/>
    <text x="380" y="174" text-anchor="middle">CANLI SUNUM</text>
    <rect x="540" y="145" width="200" height="50" rx="4" fill="#fff" stroke="#ced5d4"/>
    <text x="640" y="174" text-anchor="middle">FOLLOW-UP</text>
  </g>
  <line x1="220" y1="170" x2="276" y2="170" stroke="#536168" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="480" y1="170" x2="536" y2="170" stroke="#536168" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- row 3 -->
  <g font-size="13.5" fill="#202c32">
    <rect x="20" y="260" width="200" height="50" rx="4" fill="#fff" stroke="#ced5d4"/>
    <text x="120" y="289" text-anchor="middle">NİTELİKLİ LEAD</text>
    <rect x="280" y="260" width="200" height="50" rx="4" fill="#fdf6ee" stroke="#c9a98c"/>
    <text x="380" y="284" text-anchor="middle">ONAY</text>
    <text x="380" y="300" text-anchor="middle" font-size="11" fill="#536168">(gerekirse)</text>
    <rect x="540" y="260" width="200" height="50" rx="4" fill="#e6f0e9" stroke="#8fb6a1"/>
    <text x="640" y="289" text-anchor="middle">SATIŞ</text>
  </g>
  <line x1="220" y1="285" x2="276" y2="285" stroke="#536168" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="480" y1="285" x2="536" y2="285" stroke="#536168" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- row wrap connectors -->
  <path d="M740 80 V115 H120 V141" fill="none" stroke="#9caeb4" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M740 195 V230 H120 V256" fill="none" stroke="#9caeb4" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
